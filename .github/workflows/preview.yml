name: Preview

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: preview
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.0-preview.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-go@v7
        with:
          go-version-file: tailnet/go/go.mod
          cache-dependency-path: tailnet/go/go.sum

      - name: Install Android SDK packages
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          ndk="$(sed -n 's/^ndk = "\(.*\)"/\1/p' gradle/libs.versions.toml)"
          yes | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" "ndk;$ndk" > /dev/null

      - uses: gradle/actions/setup-gradle@v6

      - name: Write the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties

      - name: Test and build
        run: >-
          ./gradlew :rex:test :app:testDebugUnitTest :app:assembleRelease
          -Prax.versionCode="$VERSION_CODE" -Prax.versionName="$VERSION_NAME"

      - name: Publish the preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="Rax-$VERSION_NAME.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          git log -1 --format=%B > notes.md
          gh release create "preview-$VERSION_CODE" "$apk" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Preview $VERSION_CODE ($(git rev-parse --short HEAD))" \
            --notes-file notes.md
