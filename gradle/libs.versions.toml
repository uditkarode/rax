[versions]
agp = "9.5.1"
ndk = "30.0.16248370"
kotlin = "2.4.21"
coroutines = "1.11.0"
serialization = "1.12.0"
okhttp = "5.5.1"
composeBom = "2026.09.00"
activity = "1.13.0"
lifecycle = "2.11.0"
navigation3 = "1.2.1"
coreKtx = "1.19.1"
datastore = "1.3.0"
browser = "1.10.0"
splashscreen = "1.2.0"
profileinstaller = "1.4.1"
junit = "4.13.2"
androidxJunit = "1.3.0"
